---
# Task definition for test execution
# This task simulates a test by waiting 10 seconds then reporting success
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-test-task
  namespace: new-model-demo
spec:
  description: Simple test task that waits 10 seconds before succeeding
  results:
    - name: TEST_OUTPUT
      description: Test result output
      type: string
  steps:
    - name: run-test
      image: alpine:latest
      script: |
        #!/bin/sh
        echo "Starting test..."
        sleep 10
        echo "Test completed successfully"

        # Output test results
        cat > /tmp/test-output.json <<EOF
        {
          "result": "SUCCESS",
          "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
          "failures": 0,
          "successes": 1,
          "warnings": 0
        }
        EOF
        cat /tmp/test-output.json
    - name: capture-result
      image: alpine:latest
      script: |
        #!/bin/sh
        cat /tmp/test-output.json | tee $(results.TEST_OUTPUT.path)
---
# Pipeline definition used by all IntegrationTestScenarios
# This pipeline orchestrates test execution
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: integration-test-pipeline
  namespace: new-model-demo
spec:
  description: Integration test pipeline with 10-second test execution
  results:
    - name: TEST_OUTPUT
      description: Test result output
      value: $(tasks.test-execution.results.TEST_OUTPUT)
  tasks:
    - name: test-execution
      description: Execute the integration test
      taskRef:
        name: run-test-task
